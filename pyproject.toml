[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-of-maat"
version = "0.1.0"
description = "Open-source legal research and filing assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "pydantic>=2.0",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "ruff"]

[project.scripts]
maat = "maat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
